<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Enhanced Classic WordPerfect DMG Background -->
  <!-- Authentic 1990s WordPerfect blue aesthetic -->

  <defs>
    <!-- Classic WP blue gradient -->
    <linearGradient id="wpBlueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0055AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003377;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle radial highlight -->
    <radialGradient id="highlight" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Emboss effect -->
    <filter id="emboss">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="-1" dy="-1" result="offsetBlur1"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur2"/>
      <feMerge>
        <feMergeNode in="offsetBlur1"/>
        <feMergeNode in="offsetBlur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main background -->
  <rect width="600" height="400" fill="url(#wpBlueGradient)"/>
  <rect width="600" height="400" fill="url(#highlight)"/>

  <!-- Classic WP grid pattern -->
  <defs>
    <pattern id="wpGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#wpGrid)"/>

  <!-- Top title bar - authentic WP style -->
  <rect x="0" y="0" width="600" height="45" fill="#004499" opacity="0.8"/>
  <rect x="0" y="45" width="600" height="3" fill="#FFFFFF" opacity="0.4"/>
  <rect x="0" y="48" width="600" height="1" fill="#000000" opacity="0.2"/>

  <!-- Title with classic WP font styling -->
  <text x="300" y="30"
        font-family="'Courier New', Courier, monospace"
        font-size="22"
        font-weight="bold"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="3"
        filter="url(#emboss)">
    GeoStalker OSINT Suite
  </text>

  <!-- Main content panel - classic WP window style -->
  <g filter="url(#dropShadow)">
    <!-- Outer border -->
    <rect x="40" y="90" width="520" height="260"
          rx="4"
          fill="#E8E8E8"
          stroke="#CCCCCC"
          stroke-width="1"/>

    <!-- Title bar of panel -->
    <rect x="40" y="90" width="520" height="35"
          rx="4"
          fill="url(#wpBlueGradient)"
          opacity="0.95"/>
    <rect x="40" y="125" width="520" height="2"
          fill="#FFFFFF"
          opacity="0.6"/>

    <!-- Panel title -->
    <text x="300" y="112"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16"
          font-weight="bold"
          fill="#FFFFFF"
          text-anchor="middle">
      ▼ Installation Instructions ▼
    </text>

    <!-- Content area -->
    <rect x="42" y="127" width="516" height="221"
          fill="#FFFFFF"
          opacity="0.98"/>
  </g>

  <!-- Installation steps - classic numbered list -->
  <g font-family="'Courier New', Courier, monospace" font-size="14" fill="#003377">
    <text x="70" y="160" font-weight="bold">
      <tspan fill="#0055AA">1.</tspan> Drag GeoStalker.app to Applications
    </text>

    <text x="70" y="190" font-weight="bold">
      <tspan fill="#0055AA">2.</tspan> Install Python 2.7 dependencies
    </text>

    <text x="70" y="220" font-weight="bold">
      <tspan fill="#0055AA">3.</tspan> Configure API keys (see README)
    </text>

    <text x="70" y="250" font-weight="bold">
      <tspan fill="#0055AA">4.</tspan> Launch from Applications folder
    </text>
  </g>

  <!-- Additional info -->
  <text x="300" y="285"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        fill="#666666"
        text-anchor="middle"
        font-style="italic">
    For detailed setup instructions, see the included README file
  </text>

  <!-- Bottom branding area -->
  <g opacity="0.9">
    <rect x="0" y="360" width="600" height="40" fill="#002255" opacity="0.3"/>

    <text x="300" y="380"
          font-family="'Courier New', Courier, monospace"
          font-size="11"
          fill="#FFFFFF"
          text-anchor="middle"
          font-weight="bold"
          letter-spacing="1">
      OSINT Security Research Tools
    </text>

    <text x="300" y="395"
          font-family="Arial, Helvetica, sans-serif"
          font-size="9"
          fill="#AACCFF"
          text-anchor="middle">
      Follow @osintstalker • For authorized testing only
    </text>
  </g>

  <!-- Corner decorative elements - classic WP style -->
  <g opacity="0.15">
    <rect x="0" y="0" width="80" height="80" fill="#FFFFFF"/>
    <rect x="520" y="0" width="80" height="80" fill="#FFFFFF"/>
    <rect x="0" y="320" width="80" height="80" fill="#000000"/>
    <rect x="520" y="320" width="80" height="80" fill="#000000"/>
  </g>

  <!-- Subtle WP logo-inspired elements -->
  <g opacity="0.1">
    <circle cx="50" cy="50" r="25" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="550" cy="50" r="25" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>
