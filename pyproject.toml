[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "1.0.0"
description = "A super helpful AI assistant powered by Claude"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "anthropic>=0.39.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
computer-use = [
    "Pillow>=9.0",
]

[project.scripts]
ai-assistant = "ai_assistant.__main__:entry"

[tool.setuptools.packages.find]
include = ["ai_assistant*"]
